[project]
name = "integration-service"
version = "0.1.0"
description = "Financial Integration Service connecting Partners, Apache Fineract, and Mock ERP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

